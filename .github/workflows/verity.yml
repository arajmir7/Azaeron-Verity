name: Verity repository and security gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      observability_candidate:
        description: Run only the bounded Jaeger source candidate experiment
        type: boolean
        default: false
      prometheus_candidate:
        description: Run only the bounded Prometheus source candidate experiment
        type: boolean
        default: false
      otel_candidate:
        description: Run only the bounded minimal Collector source candidate experiment
        type: boolean
        default: false
      grafana_candidate:
        description: Run only the bounded patched Grafana server candidate experiment
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  derivative-mechanics:
    if: ${{ !inputs.observability_candidate && !inputs.prometheus_candidate && !inputs.otel_candidate && !inputs.grafana_candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install hash-locked CPU candidate dependencies
        run: python -m pip install --require-hashes -r backend/requirements-derivative-linux-cpu.lock
      - name: Exercise real full and LoRA training on TEST_ONLY fixtures
        env:
          PYTHONPATH: backend
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python backend/scripts/derivative_smoke.py --output /tmp/derivative-smoke
      - name: Exercise native four-family training with five TEST_ONLY splits
        env:
          PYTHONPATH: backend
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python backend/scripts/model_platform_smoke.py --output /tmp/native-v2-smoke
      - name: Audit isolated derivative dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r backend/requirements-derivative-linux-cpu.lock --no-deps --disable-pip --format json --output /tmp/derivative-audit.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: derivative-mechanics-evidence
          path: |
            /tmp/derivative-smoke/result.json
            /tmp/derivative-smoke/*-run/training-manifest.json
            /tmp/derivative-smoke/bakeoff
            /tmp/derivative-audit.json
            /tmp/native-v2-smoke/results.json
            /tmp/native-v2-smoke/*/evaluation.json
            /tmp/native-v2-smoke/*/bundle/training-manifest.json
          retention-days: 7
  repository:
    if: ${{ !inputs.observability_candidate && !inputs.prometheus_candidate && !inputs.otel_candidate && !inputs.grafana_candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Prepare an isolated runtime
        run: |
          python backend/scripts/prepare_slice0_compose.py --project verity-ci --identity-mail --port-offset 1700 --output /tmp/verity-ci.json
          python - <<'PY'
          import json, secrets
          from pathlib import Path
          path = Path('/tmp/verity-ci.json')
          config = json.loads(path.read_text())
          config['services']['grafana']['environment']['GF_SECURITY_ADMIN_PASSWORD'] = secrets.token_urlsafe(32)
          path.write_text(json.dumps(config, indent=2) + '\n')
          path.chmod(0o600)
          PY
      - name: Build runtime and verification images
        id: runtime_build
        run: docker compose -f /tmp/verity-ci.json --profile verification build postgres redis backend celery-worker celery-beat migrate frontend verification minio minio-init jaeger otel-collector grafana mailpit
      - name: Migrate and wait for dependencies
        run: docker compose -f /tmp/verity-ci.json up -d --wait --wait-timeout 180 backend celery-worker frontend jaeger otel-collector prometheus
      - name: Verify specification, API, schema and migration contracts
        run: |
          python -m unittest discover -s scripts/tests -p 'test_verity_spec_gate.py'
          curl --fail --silent --show-error http://localhost:9700/api/openapi.json -o /tmp/verity-ci-openapi.json
          docker compose -f /tmp/verity-ci.json exec -T postgres psql -U azaeron -d azaeron -X -q -t -A -f - < scripts/verity_schema_catalog.sql > /tmp/verity-ci-schema.json
          python scripts/verity_spec_gate.py --openapi /tmp/verity-ci-openapi.json --schema /tmp/verity-ci-schema.json | tee /tmp/verity-ci-spec-gate.json
      - name: Execute repository gate including live browser and PostgreSQL tests
        run: python scripts/verity_gate.py --compose /tmp/verity-ci.json --browser-url http://localhost:4700 --output docs/verity/evidence/ci
      - name: Verify persisted traces, scraping, alert rules, Grafana and redacted logs
        run: |
          set -euo pipefail
          docker compose -f /tmp/verity-ci.json up -d grafana
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:4701/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          python scripts/verity_observability_gate.py --compose /tmp/verity-ci.json --output docs/verity/evidence/ci/observability
      - name: Install security scanners
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        run: python -m pip install pip-audit==2.10.1 bandit==1.9.4 detect-secrets==1.5.0
      - name: Dependency audits
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        run: |
          python -m pip_audit -r backend/requirements-dev.lock --no-deps --disable-pip
          npm audit --prefix frontend
      - name: SAST and source secret gate
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        run: |
          python -m bandit -r backend/app
          python scripts/verity_secret_gate.py
      - name: Export frontend SBOM
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        run: npm --prefix frontend sbom --sbom-format cyclonedx > docs/verity/evidence/ci/frontend.cdx.json
      - name: Reclaim build cache before image scans
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        run: |
          df -h / /tmp
          docker system df
          docker builder prune --all --force
          df -h / /tmp
          docker system df
      - name: Pull pinned infrastructure images for security coverage
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        run: docker compose -f /tmp/verity-ci.json --profile '*' pull --ignore-buildable
      - name: Scan every Compose image and generate SBOMs
        if: ${{ !cancelled() && steps.runtime_build.outcome == 'success' }}
        run: python scripts/verity_image_gate.py --compose /tmp/verity-ci.json --output docs/verity/evidence/ci/images
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: verity-gate-evidence
          path: |
            docs/verity/evidence/ci
            docs/verity/evidence/secret-gate.json
            frontend/test-results
          retention-days: 7
      - name: Stop isolated runtime
        if: always()
        run: docker compose -f /tmp/verity-ci.json down --volumes
  jaeger-source-candidate:
    if: ${{ inputs.observability_candidate && !inputs.prometheus_candidate && !inputs.otel_candidate && !inputs.grafana_candidate }}
    uses: ./.github/workflows/verity-observability-candidate.yml
  prometheus-source-candidate:
    if: ${{ inputs.prometheus_candidate && !inputs.observability_candidate && !inputs.otel_candidate && !inputs.grafana_candidate }}
    uses: ./.github/workflows/verity-prometheus-candidate.yml
  otel-source-candidate:
    if: ${{ inputs.otel_candidate && !inputs.observability_candidate && !inputs.prometheus_candidate && !inputs.grafana_candidate }}
    uses: ./.github/workflows/verity-otel-candidate.yml
  grafana-source-candidate:
    if: ${{ inputs.grafana_candidate && !inputs.observability_candidate && !inputs.prometheus_candidate && !inputs.otel_candidate }}
    uses: ./.github/workflows/verity-grafana-candidate.yml
