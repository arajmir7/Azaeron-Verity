name: Verity Prometheus source candidate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  prometheus-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check isolated runner disk before source build
        run: |
          set -euo pipefail
          mkdir -p /tmp/verity-prometheus-candidate
          df -h / | tee /tmp/verity-prometheus-candidate/disk-before.txt
          available=$(df -P -B1 / | awk 'NR == 2 {print $4}')
          if (( available < 14 * 1024 * 1024 * 1024 )); then
            echo 'BLOCKED: less than 14 GiB free for bounded source build' | tee /tmp/verity-prometheus-candidate/preflight.txt
            exit 78
          fi
      - name: Build patched upstream Prometheus with a 6 GiB disk floor
        id: build
        run: |
          set -euo pipefail
          docker build --progress=plain \
            -f infrastructure/prometheus/Dockerfile.candidate \
            -t verity-prometheus:candidate infrastructure/prometheus \
            > /tmp/verity-prometheus-candidate/build.log 2>&1 &
          build_pid=$!
          (
            while kill -0 "$build_pid" 2>/dev/null; do
              available=$(df -P -B1 / | awk 'NR == 2 {print $4}')
              if (( available < 6 * 1024 * 1024 * 1024 )); then
                echo 'BLOCKED: source build reached 6 GiB free-disk floor' >> /tmp/verity-prometheus-candidate/build.log
                kill -TERM "$build_pid"
                exit 0
              fi
              sleep 5
            done
          ) &
          monitor_pid=$!
          set +e
          wait "$build_pid"
          result=$?
          set -e
          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true
          tail -n 80 /tmp/verity-prometheus-candidate/build.log
          df -h / | tee /tmp/verity-prometheus-candidate/disk-after.txt
          exit "$result"
      - name: Verify binary lineage and standalone Prometheus HTTP API
        run: |
          set -euo pipefail
          docker run --rm --entrypoint cat verity-prometheus:candidate /usr/share/prometheus/build-info.txt \
            | tee /tmp/verity-prometheus-candidate/build-info.txt
          grep -F 'go1.27.2' /tmp/verity-prometheus-candidate/build-info.txt
          grep -F 'golang.org/x/net' /tmp/verity-prometheus-candidate/build-info.txt | grep -F 'v0.60.0'
          printf 'global:\n  scrape_interval: 15s\nscrape_configs:\n  - job_name: prometheus\n    static_configs:\n      - targets: [localhost:9090]\n' \
            > /tmp/verity-prometheus-candidate/smoke.yml
          container=$(docker run -d -p 127.0.0.1:19090:9090 \
            -v /tmp/verity-prometheus-candidate/smoke.yml:/etc/prometheus/smoke.yml:ro \
            verity-prometheus:candidate --config.file=/etc/prometheus/smoke.yml)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:19090/-/ready; then
              ready=1
              break
            fi
            sleep 1
          done
          docker logs "$container" > /tmp/verity-prometheus-candidate/runtime.log 2>&1 || true
          docker inspect "$container" --format '{{json .State}}' \
            > /tmp/verity-prometheus-candidate/container-state.json
          if (( ready != 1 )); then
            cat /tmp/verity-prometheus-candidate/runtime.log
            cat /tmp/verity-prometheus-candidate/container-state.json
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:19090/api/v1/targets \
            -o /tmp/verity-prometheus-candidate/targets.json
          grep -F '"status":"success"' /tmp/verity-prometheus-candidate/targets.json
          curl --fail --silent --show-error -L http://127.0.0.1:19090/query \
            -o /tmp/verity-prometheus-candidate/ui.html
          grep -Eiq '<html|<!doctype' /tmp/verity-prometheus-candidate/ui.html
      - name: Scan candidate image and generate SBOM
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: python scripts/verity_image_gate.py verity-prometheus:candidate --output /tmp/verity-prometheus-candidate/images
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: prometheus-source-candidate-evidence
          path: /tmp/verity-prometheus-candidate
          retention-days: 7
