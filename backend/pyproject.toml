[project]
name = "azaeron-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
# Models use SQLAlchemy string forward references and app.models intentionally
# imports model symbols for registration. Those patterns are runtime-required.
ignore = ["F401", "F821"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
