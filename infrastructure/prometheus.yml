global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: azaeron-backend
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: [backend:8000]

  - job_name: azaeron-worker
    static_configs:
      - targets: [celery-worker:9100]
